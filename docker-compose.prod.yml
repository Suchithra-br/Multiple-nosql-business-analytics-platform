# ==============================================================================
# Multi-NoSQL Real-Time Business Analytics Platform - Production Docker Compose
# ==============================================================================
# Full-stack production deployment with containerized backend, frontend,
# and all four NoSQL databases with health-gated startup and persistent volumes.
# ==============================================================================

name: multi-nosql-analytics-prod

services:
  # ----------------------------------------------------------------------------
  # MongoDB (Operational Document Store)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:8
    container_name: prod-analytics-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-business_analytics}
    volumes:
      - prod_mongodb_data:/data/db
    networks:
      - analytics-prod-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Redis (In-Memory KPI Cache & Leaderboards)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: prod-analytics-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - prod_redis_data:/data
    networks:
      - analytics-prod-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s

  # ----------------------------------------------------------------------------
  # Apache Cassandra (Time-Series & Wide-Column Store)
  # ----------------------------------------------------------------------------
  cassandra:
    image: cassandra:5
    container_name: prod-analytics-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "Analytics Cluster"
      CASSANDRA_DC: "datacenter1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      MAX_HEAP_SIZE: "1024M"
      HEAP_NEWSIZE: "256M"
    volumes:
      - prod_cassandra_data:/var/lib/cassandra
    networks:
      - analytics-prod-net
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ----------------------------------------------------------------------------
  # Neo4j (Graph & Relationship Store)
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5
    container_name: prod-analytics-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-superstore_password_123}"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - prod_neo4j_data:/data
    networks:
      - analytics-prod-net
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p superstore_password_123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ----------------------------------------------------------------------------
  # FastAPI Production Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prod-analytics-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      API_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: business_analytics
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: business_analytics
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: superstore_password_123
      CORS_ORIGINS: http://localhost:3000,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:80,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
    networks:
      - analytics-prod-net
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # React Production Frontend Service (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: prod-analytics-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - analytics-prod-net
    depends_on:
      - backend

volumes:
  prod_mongodb_data:
    name: multi-nosql-analytics-prod_mongodb_data
  prod_redis_data:
    name: multi-nosql-analytics-prod_redis_data
  prod_cassandra_data:
    name: multi-nosql-analytics-prod_cassandra_data
  prod_neo4j_data:
    name: multi-nosql-analytics-prod_neo4j_data

networks:
  analytics-prod-net:
    name: multi-nosql-analytics-prod_net
